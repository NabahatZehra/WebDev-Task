<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="checkoutstyle.css">
</head>
<body>

  <header class="checkout-header">
    <img src="../LabTask1/recordsLogo.png" alt="Logo" class="checkout-logo">
  </header>

  <div class="checkout-container">
    <h1>Checkout Page</h1>
    <h4 class="text-center mb-4">Billing & Payment Information</h4>
    <form id="checkoutForm" novalidate>

      <div class="mb-3">
        <label for="fullname" class="form-label">Full Name</label>
        <input type="text" id="fullname" class="form-control" placeholder="Enter your full name">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email">
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="text" id="phone" class="form-control" placeholder="Enter your phone number">
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" class="form-control" placeholder="Enter your address">
      </div>

      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" class="form-control" placeholder="Enter your city">
      </div>

      <div class="mb-3">
        <label for="postal" class="form-label">Postal Code</label>
        <input type="text" id="postal" class="form-control" placeholder="Enter postal code">
      </div>

      <div class="mb-3">
        <label for="country" class="form-label">Country</label>
        <select id="country" class="form-select">
          <option value="">Select your country</option>
          <option>Pakistan</option>
          <option>India</option>
          <option>USA</option>
          <option>UK</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Payment Method</label>
        <div>
          <input type="radio" name="payment" id="payCard" value="card">
          <label for="payCard">Card</label>
          <input type="radio" name="payment" id="payCOD" value="cod" class="ms-3">
          <label for="payCOD">Cash on Delivery</label>
        </div>
      </div>

      <div id="cardDetails" style="display: none;">
        <div class="mb-3">
          <label for="cardNumber" class="form-label">Card Number</label>
          <input type="text" id="cardNumber" class="form-control" placeholder="Enter card number">
        </div>

        <div class="mb-3">
          <label for="expiry" class="form-label">Expiry Date</label>
          <input type="month" id="expiry" class="form-control">
        </div>

        <div class="mb-3">
          <label for="cvv" class="form-label">CVV</label>
          <input type="text" id="cvv" class="form-control" placeholder="Enter CVV">
        </div>
      </div>

      <div class="form-check mb-4">
        <input type="checkbox" id="terms" class="form-check-input">
        <label for="terms" class="form-check-label">I agree to the terms and conditions</label>
      </div>

      <button type="submit" class="btn btn-custom w-100">Place Order</button>
    </form>
  </div>

  <footer class="box6">
    <div class="box6-container">
      <img src="../LabTask1/home_record_footer_logo.png" alt="Logo">
      <div class="divider"></div>
      <p>© 2021 Betheme by Muffin group | All Rights Reserved | Powered by WordPress</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.querySelectorAll('input[name="payment"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        const cardDetails = document.getElementById('cardDetails');
        if (document.getElementById('payCard').checked) {
          cardDetails.style.display = 'block';
        } else {
          cardDetails.style.display = 'none';
        }
      });
    });

    document.getElementById('checkoutForm').addEventListener('submit', function (e) {
      e.preventDefault(); 
      window.location.href = "success.html"; 
    });
  </script>
</body>
</html>
