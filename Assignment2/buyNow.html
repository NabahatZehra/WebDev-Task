<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD App - JSONPlaceholder</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="crudstyle.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <!-- ===== Header / Navbar ===== -->
  <header class="checkout-header">
    <img src="../LabTask1/recordsLogo.png" alt="Records Logo" class="checkout-logo">
  </header>

  <!-- ===== Main Content ===== -->
  <div class="container mt-4">
    <h1 class="text-center mb-4">CRUD App</h1>

    <!-- Form -->
    <div class="card mb-4">
      <div class="card-header">Add / Edit Post</div>
      <div class="card-body">
        <form id="postForm">
          <input type="hidden" id="postId">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Body</label>
            <textarea id="body" class="form-control" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="reset" class="btn btn-secondary" id="cancelEdit">Cancel</button>
        </form>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="card-header">Posts List</div>
      <div class="card-body">
        <table class="table table-striped" id="postsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Body</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Posts will load here -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Checkout Button -->
    <div class="text-end mt-3">
      <a href="../LabAssignment2/validation_form.html" class="btn btn-custom">Go to Checkout</a>
    </div>
  </div>


  <footer class="box6">
    <div class="box6-container">
      <img src="../LabTask1/home_record_footer_logo.png" alt="Logo">
      <div class="divider"></div>
      <p>© 2021 Betheme by Muffin group | All Rights Reserved | Powered by WordPress</p>
    </div>
  </footer>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
